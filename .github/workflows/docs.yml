name: docs

# Build the VitePress documentation site on every push to main and on
# every PR that touches docs/ or the workflow file itself. Optionally
# deploys to GitHub Pages via workflow_dispatch.
#
# Two stages:
#   1. build (every push + PR) — runs `npm run build`, uploads the static
#      site as an artifact, reports link-check failures.
#   2. deploy (workflow_dispatch only) — runs build then publishes to
#      GitHub Pages. Requires repo settings: Settings → Pages → Source
#      = GitHub Actions. Manual trigger via the Actions tab keeps
#      deploys deliberate.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages after build'
        type: boolean
        default: false
        required: false

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # NOTE: no job-level NODE_ENV=production here. npm skips
      # devDependencies when NODE_ENV=production, so vitepress/vue (both
      # dev deps) were never installed on the runner and `npx vitepress
      # build` failed with "Cannot find package 'vitepress'". VitePress
      # sets its own build mode; the variable is unnecessary.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No submodules today, but defense-in-depth: docs/superpowers/ is
          # currently gitignored per .gitignore, but if it ever moves to a
          # submodule the build should still pick it up (and VitePress
          # srcExclude already strips it from the output).
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Show environment
        run: |
          node --version
          npm --version
          echo "---"
          echo "VitePress config:"
          head -5 docs/.vitepress/config.ts

      - name: Install dependencies
        working-directory: docs
        # Use `npm ci` for fast, reproducible installs. Requires
        # docs/package-lock.json to be checked in (it is). The
        # `cache-dependency-path: 'docs/package-lock.json'` directive
        # on actions/setup-node above keys the npm cache on this file.
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        working-directory: docs
        run: npx vitepress build --logLevel info

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuron-docs-${{ github.sha }}
          path: docs/.vitepress/dist
          retention-days: 14
          if-no-files-found: error
          compression-level: 9

      - name: Summary
        if: always()
        run: |
          echo "## VitePress build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d docs/.vitepress/dist ]; then
            echo "- **Output**: docs/.vitepress/dist/ ($(du -sh docs/.vitepress/dist | awk '{print $1}'))" >> $GITHUB_STEP_SUMMARY
            echo "- **HTML pages**: $(find docs/.vitepress/dist -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset count**: $(find docs/.vitepress/dist -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::VitePress build output directory not found" >> $GITHUB_STEP_SUMMARY
          fi

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on the same triggers as the build: any push to main or PR that
    # touches docs/source files. Independently gated, so a broken link
    # never blocks the VitePress build (which keeps `ignoreDeadLinks:true`
    # to handle transient HTTPS errors gracefully). Reports as a separate
    # status check that reviewers can choose to require.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scan the docs site + top-level contributor references. Excluded:
          #   docs/superpowers/**  — internal design specs (gitignored) that
          #                            intentionally link to gitignored siblings
          #   localhost / 127.0.0.1 / mailto — appear in cURL / example payloads
          args: >-
            --no-progress
            --exclude-loopback
            --exclude 'docs/superpowers/**'
            --exclude 'docs/.vitepress/**'
            --exclude 'docs/node_modules/**'
            --max-concurrency 8
            --timeout 30
            --retry 1
            --retry-wait-time 1
            .
          # `fail: false` so link-check reports as a warning rather than a
          # blocking red ❌. This lets the workflow catch real rot (e.g. a
          # model card deletion on HuggingFace) without making the doc site
          # PR unmergeable when an external site has transient downtime.
          # Reviewers should treat a warning as "fix before next release".
          fail: false

      - name: Summary
        if: always()
        run: |
          echo "## Markdown link check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned: docs/, README.md, AGENTS.md, ARCHITECTURE.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Broken-link warnings are non-blocking (fail: false). Treat as fix-before-merge." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to GitHub Pages (gh-pages branch)
    needs: [build, link-check]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A manual deploy must not be cancelled by a fresh push-to-main
    # build that happens to land on the same ref. Without this guard, a
    # Pages deploy kicked off by an operator could be silently aborted
    # mid-flight by the next push workflow.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    # Pushing the gh-pages branch needs contents:write (job-level
    # permissions override the workflow-level read-only grant).
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: neuron-docs-${{ github.sha }}
          path: dist

      # Branch-based Pages deployment. The actions/deploy-pages service
      # rejected this repo's artifacts with a deterministic
      # "deployment_content_failed" (2026-10-09/11; artifact verified
      # clean: 3.1 MB, 83 files, no links) — the classic gh-pages-branch
      # path bypasses that service entirely.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true

      - name: Post-deploy summary
        run: |
          echo "## Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Page URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow run**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
