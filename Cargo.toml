[package]
name = "neuron"
version = "0.1.0"
edition = "2024"
description = "Neuron - Neural Inference Runtime (LLM/TTS/ASR/Rerank/Embedding/Vision) — OpenAI- and Anthropic-compatible inference engine for embedding into Rust hosts"
authors = ["Neuron Team"]
license = "Apache-2.0"
repository = "https://github.com/ibloc/neuron"
homepage = "https://github.com/ibloc/neuron"
keywords = ["rust", "inference", "openai", "llm", "tts", "asr", "rerank", "embedding", "vision"]
categories = ["api-bindings", "command-line-utilities", "machine-learning"]

[lib]
name = "neuron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
# Outbound PII redaction engine — shared with synapse / prefrontal so
# every external-model path redacts identically. Kept in its own crate
# so neuron does not inherit synapse's runtime dependencies.
synapse-privacy = { path = "../synapse/crates/privacy" }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
futures-channel = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
fastrand = "2"

candle = { git = "https://github.com/huggingface/candle.git", rev = "aebc405d2b4bf42808387e0ca597bf7dad9b565f", optional = true, package = "candle-core" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "aebc405d2b4bf42808387e0ca597bf7dad9b565f", optional = true }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "aebc405d2b4bf42808387e0ca597bf7dad9b565f", optional = true }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "aebc405d2b4bf42808387e0ca597bf7dad9b565f", optional = true }
tokenizers = { version = "0.22", optional = true }
litert-lm = { version = "0.1", optional = true }
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "v0.8.22", optional = true }
# llama.cpp backend — safe Rust binding (llama-cpp-2 / utilityai/llama-cpp-rs).
# Default features include OpenMP + `common` + `mtmd` (multimodal: vision
# projector + audio). The first time you turn on the `llamacpp` feature,
# the build script compiles llama.cpp via `cmake` and therefore needs a
# C++ toolchain on PATH: Windows → Visual Studio Build Tools (MSVC) +
# cmake; Linux → gcc/clang + cmake; macOS → Xcode + cmake. Default builds
# (no `llamacpp` feature) do not touch this dep.
llama-cpp-2 = { version = "0.1", optional = true, features = ["mtmd"] }

burn = { version = "0.21", features = ["ndarray"], optional = true }
burn-store = { version = "0.21", features = ["safetensors"], optional = true }
hound = { version = "3.5", optional = true }
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "pcm"], optional = true }
rubato = { version = "3", optional = true }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
base64 = { version = "0.22", optional = true }
# Fast ONNX executor for the OCR pipeline (`ort` feature). rc.13 wraps
# onnxruntime 1.28; the vitis.rs load-dynamic gating bug (#547) was rc.12.
# load-dynamic (host supplies onnxruntime.dll via ORT_DYLIB_PATH or PATH) —
# the static download-binaries build links /MD CRT objects, which conflicts
# with the /MT objects cc-based deps (esaxx_rs) emit on Windows (LNK2038).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }
safetensors = { version = "0.4", optional = true }
wide = { version = "0.7", optional = true }
ndarray = { version = "0.16", optional = true }
tract-onnx = { version = "0.21", optional = true }
rustfft = { version = "6", optional = true }
sherpa-onnx = { version = "1.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
safetensors = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
safetensors = { version = "0.4" }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "mobile_bench"
harness = false

[[bench]]
name = "lora_bench"
harness = false

# Cross-framework LLM speed comparison (neuron vs vLLM / ollama /
# llama.cpp). `harness = false` because this is a multi-second HTTP
# round-trip harness with its own p50/p95 math -- Criterion's
# iteration model does not fit. It never starts a server itself: it
# drives whatever endpoints NEURON_BENCH_ENDPOINTS names and reports
# "not available" for anything unreachable.
[[bench]]
name = "llm_speed"
harness = false

# ASR speed comparison: neuron's own tract ONNX path vs sherpa-onnx
# (official onnxruntime-backed Rust binding) running the SAME exported
# SenseVoice graph. In-process, so unlike llm_speed this one does all
# the work itself -- but it shares the harness = false pattern because
# a single measurement is a full audio forward pass, not a cheap loop.
[[bench]]
name = "asr_speed"
harness = false
# The bench's `Engine` enum has both variants behind feature gates
# (`tract` / `sherpa`). With neither of them on the enum is empty and
# every `match self` on it stops being exhaustive. Requiring `tract`
# keeps the default build green; the `sherpa` arm stays `cfg`-gated, so
# the bench still compares both when `sherpa` is enabled too.
required-features = ["tract"]

# llama.cpp backend speed: drives neuron's own `LlamaCppLlmRuntime`
# in-process. Complements `llm_speed.rs` (which drives external HTTP
# servers) by measuring the embedded adapter path — what a host using
# `NEURON_LLM_RUNTIME=llamacpp` actually pays per request. Build needs
# the `llamacpp` feature (cmake + C++ toolchain + libclang on PATH).
[[bench]]
name = "llamacpp_speed"
harness = false
required-features = ["llamacpp"]

# Per-capability x per-engine x per-device model matrix. Drives a running
# neuron server (start with examples/neuron_server) and reports latency /
# peak RSS / RTF per row.
[[bench]]
name = "model_matrix"
harness = false

# Chronos2 integration tests need the `chronos2` feature — the runtime
# they drive (`CandleChronos2Runtime`) lives behind it, so without the
# feature the test target does not compile.
[[test]]
name = "chronos2_integration"
required-features = ["chronos2"]

[[example]]
name = "ocr_smoke"
required-features = ["ocr"]

# Real-weights verification that StreamingVaeDecoder reproduces the full
# AudioVaeV2::decode on the shipped audiovae.pth — the gate for wiring
# model-level streaming into TtsRuntime::synthesize_stream. Needs the
# openbmb/VoxCPM2 download (see the example header for the run command).
[[example]]
name = "voxcpm2_stream_smoke"
required-features = ["voxcpm"]

# End-to-end HTTP smoke for POST /v1/audio/speech/stream — boots an embedded
# server with the real VoxCPM2 checkpoint and measures first-byte latency
# against the legacy /v1/audio/speech path.
[[example]]
name = "voxcpm2_stream_http_smoke"
required-features = ["voxcpm"]

[features]
default = ["candle"]
candle = ["dep:candle", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:image", "dep:base64", "dep:safetensors", "dep:wide"]
flash-attn = ["candle-transformers/flash-attn", "dep:candle-flash-attn"]
metal = ["candle/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
chronos2 = ["candle"]
voxcpm = ["dep:burn", "dep:burn-store", "dep:hound", "dep:base64", "dep:tokenizers"]
# Burn-side CUDA backend for the VoxCPM2 TTS runtime (CubeCL kernels).
# Separate from the `cuda` feature above, which is candle's: pulling
# burn/cuda in compiles the CubeCL stack, which is a heavy build. Combine
# them (`--features cuda,voxcpm-cuda`) to put both the LLM and the TTS on
# the GPU. No build-time CUDA toolkit is required (cudarc uses the driver
# API + NVRTC with dynamic-loading fallback), but at runtime the CUDA
# toolkit's `bin` directory must be on PATH so NVRTC can be loaded.
voxcpm-cuda = ["voxcpm", "burn/cuda"]
litert = ["dep:litert-lm"]
asr-audio = ["dep:symphonia", "dep:rubato"]
mistralrs = ["dep:mistralrs", "candle"]
# Pure-Rust GGUF inference via the llama-cpp-2 binding. Build needs cmake
# + a C++ compiler (see the dep comment above). The `candle` feature is
# NOT pulled in — llama-cpp-2 compiles its own ggml-backed inference stack.
llamacpp = ["dep:llama-cpp-2"]
ndarray = ["dep:ndarray"]
# Own-ONNX ASR (SenseVoice via tract) reuses the tract feature; rustfft
# backs the kaldi-style fbank extraction in src/asr/fbank.rs.
# The PP-OCR pipeline (src/ocr/) lives behind the `ocr` meta feature (image
# decode + base64 for the request image source), which `tract` and `ort`
# both enable: `tract` is the pure-Rust executor, `ort` the fast one
# (verified against ort 2.0.0-rc.13, where the rc.12 vitis.rs load-dynamic
# gating bug is fixed).
tract = ["dep:tract-onnx", "dep:ndarray", "dep:tokenizers", "dep:rustfft", "ocr"]
ort = ["dep:ort", "ocr"]
ocr = ["dep:image", "dep:base64"]
sherpa = ["dep:sherpa-onnx"]


