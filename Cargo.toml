[package]
name = "neuron"
version = "0.1.0"
edition = "2024"
# 平台地板：与海马体那条线对齐（lance 14 的 rust-version 是 1.94.0）。
rust-version = "1.94"
description = "Neuron - Neural Inference Runtime (LLM/TTS/ASR/Rerank/Embedding/Vision) — OpenAI- and Anthropic-compatible inference engine for embedding into Rust hosts"
authors = ["Neuron Team"]
license = "Apache-2.0"
repository = "https://github.com/ibloc/neuron"
homepage = "https://github.com/ibloc/neuron"
keywords = ["rust", "inference", "openai", "llm", "tts", "asr", "rerank", "embedding", "vision"]
categories = ["api-bindings", "command-line-utilities", "machine-learning"]

[lib]
name = "neuron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
# Outbound PII redaction engine — shared with synapse / prefrontal so
# every external-model path redacts identically. Kept in its own crate
# so neuron does not inherit synapse's runtime dependencies.
synapse-privacy = { path = "../synapse/crates/privacy" }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
futures-channel = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
fastrand = "2"

# ⚠️ 2026-11-19（依赖升级那一刀）：**candle 的 rev 与 mistral.rs v0.9.5 对齐**
# ⇒ ⇒ （同一个 rev **66a8cf1**）⇒ ⇒ 起因：mistral.rs v0.9.5 把 candle 钉在
# ⇒ ⇒ `rev = 66a8cf1`，neuron 自己钉的是 `rev = aebc405d` ⇒ ⇒ **同一个 candle
# ⇒ ⇒（都是 0.11.0）被编了两份** ⇒ ⇒ candle-core/nn/transformers/kernels
# ⇒ ⇒ **编译两遍、体积两倍** ⇒ ⇒ 统一到一个 rev ⇒ ⇒ 只编一次。
# ⇒ ⇒ ⚠️ 两版 candle **都是 0.11.0** ⇒ ⇒ 版本要求对得上（mistral.rs 要
# ⇒ ⇒ `version = "0.11.0"`）⇒ ⇒ 统一是合法的。
# ⇒ ⇒ ⚠️ `[patch]` 那条路走不通：cargo 明确拒绝「patch 指向同一个源」
# ⇒ ⇒ （逐字：「patches must point to different sources」；连 URL 少写
# ⇒ ⇒ `.git` 也一样——它会规范化）⇒ ⇒ 只能让两边 **pin 同一个 rev**。
# ⇒ ⇒ ⚠️ 选 66a8cf1 的代价与补救：**candle-kernels@66a8cf1 的 build.rs 少了
# ⇒ ⇒ CUDA 13 需要的 `/Zc:preprocessor`**（aebc405d 那份有：CUDA 13 的 CCCL
# ⇒ ⇒ 在 MSVC 传统预处理器下 `#error C1189` 硬报错 ⇒ ⇒ nvcc 直接死 ⇒ ⇒
# ⇒ ⇒ **报错是空的**，看不出来）⇒ ⇒ 用 `scripts\cuda-build.bat` 里的
# ⇒ ⇒ `NVCC_PREPEND_FLAGS` 补（实测有效），**上游修法＝给 candle-kernels 的
# ⇒ ⇒ build.rs 加回那两行**（aebc405d 已有，可作参照）。
candle = { git = "https://github.com/huggingface/candle.git", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true, package = "candle-core" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "66a8cf184a5a519671454066b1b9efd446ec9f5c", optional = true }
tokenizers = { version = "0.22", optional = true }
litert-lm = { version = "0.1", optional = true }
# ⚠️ 2026-11-19（依赖升级那一刀）：mistralrs **v0.8.22 → v0.9.5**。
# ⇒ ⇒ **为什么这一刀值**：v0.9.0 起 mistral.rs 把 candle 从 **0.10.2** 换成
# ⇒ ⇒ **0.11.0**（`candle-core = { git=…, version="0.11.0", rev="66a8cf1" }`），
# ⇒ ⇒ 而 **v0.8.22 带进来的是 candle 0.10.2**（rev e020e8a）⇒ ⇒ 旧锁里**同时**
# ⇒ ⇒ 有 candle 0.11.0（neuron 自己的 pin）与 candle 0.10.2（mistralrs 带进来的）
# ⇒ ⇒ ⇒ ⇒ 台账 U+37F2 条④ 那道「CUDA 13.4 × candle-kernels 0.10.2 ⇒ afq.cu
# ⇒ ⇒ ⇒ ⇒ nvcc 空报错死」**就是被后两份害的** ⇒ ⇒ 升上去能把它们赶出图。
# ⇒ ⇒ **这一条也是「GPU 读数」那格欠着的唯一一道锁**（此前 3090 全闲、只有 CPU/F32）。
# ⇒ ⇒ ⚠️ v0.8→v0.9 是**破坏性大版本** ⇒ ⇒ 我们只用到一个文件
# ⇒ ⇒ （`src/llm/mistralrs_runtime.rs` ＋ `examples/_probe_raw_tokens.rs`）⇒ ⇒ 口径很窄。
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "v0.9.5", optional = true }
# llama.cpp backend — safe Rust binding (llama-cpp-2 / utilityai/llama-cpp-rs).
# Default features include OpenMP + `common` + `mtmd` (multimodal: vision
# projector + audio). The first time you turn on the `llamacpp` feature,
# the build script compiles llama.cpp via `cmake` and therefore needs a
# C++ toolchain on PATH: Windows → Visual Studio Build Tools (MSVC) +
# cmake; Linux → gcc/clang + cmake; macOS → Xcode + cmake. Default builds
# (no `llamacpp` feature) do not touch this dep.
llama-cpp-2 = { version = "0.1", optional = true, features = ["mtmd"] }

burn = { version = "0.21", features = ["ndarray"], optional = true }
burn-store = { version = "0.21", features = ["safetensors"], optional = true }
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "pcm"], optional = true }
rubato = { version = "3", optional = true }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Fast ONNX executor for the OCR pipeline (`ort` feature). rc.13 wraps
# onnxruntime 1.28; the vitis.rs load-dynamic gating bug (#547) was rc.12.
# load-dynamic (host supplies onnxruntime.dll via ORT_DYLIB_PATH or PATH) —
# the static download-binaries build links /MD CRT objects, which conflicts
# with the /MT objects cc-based deps (esaxx_rs) emit on Windows (LNK2038).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }
safetensors = { version = "0.4", optional = true }
wide = { version = "0.7", optional = true }
ndarray = { version = "0.16", optional = true }
tract-onnx = { version = "0.21", optional = true }
rustfft = { version = "6", optional = true }
sherpa-onnx = { version = "1.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
safetensors = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
safetensors = { version = "0.4" }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bench]]
name = "perf"
harness = false
# Drives the candle vision runtime directly (`vision::lora_weights`), so it
# cannot compile in a candle-free build.
required-features = ["candle"]

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "mobile_bench"
harness = false

[[bench]]
name = "lora_bench"
harness = false

# Cross-framework LLM speed comparison (neuron vs vLLM / ollama /
# llama.cpp). `harness = false` because this is a multi-second HTTP
# round-trip harness with its own p50/p95 math -- Criterion's
# iteration model does not fit. It never starts a server itself: it
# drives whatever endpoints NEURON_BENCH_ENDPOINTS names and reports
# "not available" for anything unreachable.
[[bench]]
name = "llm_speed"
harness = false

# ASR speed comparison: neuron's own tract ONNX path vs sherpa-onnx
# (official onnxruntime-backed Rust binding) running the SAME exported
# SenseVoice graph. In-process, so unlike llm_speed this one does all
# the work itself -- but it shares the harness = false pattern because
# a single measurement is a full audio forward pass, not a cheap loop.
[[bench]]
name = "asr_speed"
harness = false
# The bench's `Engine` enum has both variants behind feature gates
# (`tract` / `sherpa`). With neither of them on the enum is empty and
# every `match self` on it stops being exhaustive. Requiring `tract`
# keeps the default build green; the `sherpa` arm stays `cfg`-gated, so
# the bench still compares both when `sherpa` is enabled too.
required-features = ["tract"]

# llama.cpp backend speed: drives neuron's own `LlamaCppLlmRuntime`
# in-process. Complements `llm_speed.rs` (which drives external HTTP
# servers) by measuring the embedded adapter path — what a host using
# `NEURON_LLM_RUNTIME=llamacpp` actually pays per request. Build needs
# the `llamacpp` feature (cmake + C++ toolchain + libclang on PATH).
[[bench]]
name = "llamacpp_speed"
harness = false
required-features = ["llamacpp"]

# Per-capability x per-engine x per-device model matrix. Drives a running
# neuron server (start with examples/neuron_server) and reports latency /
# peak RSS / RTF per row.
[[bench]]
name = "model_matrix"
harness = false

# Per-model benchmark: one case per model in the capability catalog, run
# in-process on the local device (RTX 3090 by default). `harness = false`
# because a real forward pass takes seconds — the harness does its own
# warmup + p50/p95 math and writes a markdown report.
[[bench]]
name = "model_bench"
harness = false

# Same-model × backend matrix: one row per (model, backend, device) so
# the *same weights* can be compared across the backends that can serve
# them (candle / mistralrs / …), and so a backend's refusal to serve a
# model shows up as a measured row instead of a footnote.
[[bench]]
name = "backend_matrix"
harness = false

# Chronos2 integration tests need the `chronos2` feature — the runtime
# they drive (`CandleChronos2Runtime`) lives behind it, so without the
# feature the test target does not compile.
[[test]]
name = "chronos2_integration"
required-features = ["chronos2"]

[[example]]
name = "ocr_smoke"
required-features = ["ocr"]

# Real-weights smoke for Tencent WeVisOne-VL on the mistralrs leg: loads a
# local snapshot and asks the model to detect objects in a picture.
[[example]]
name = "wevisone_vl_smoke"
required-features = ["mistralrs"]

# Real-weights smoke for the Qwen3.8-27B family: the mistralrs leg loads an
# HF-format snapshot through the Qwen3_5 loader (27B inherits the Qwen3.5
# verdict — point it at Qwen3.5-4B when the 54 GB bf16 checkpoint doesn't
# fit the disk); the optional llamacpp leg loads the unsloth 27B GGUF
# (arch qwen35) directly. Both answer the same question; think-block
# passthrough is asserted, not assumed.
[[example]]
name = "qwen3_8_27b_smoke"
required-features = ["mistralrs"]

# Real-weights verification that StreamingVaeDecoder reproduces the full
# AudioVaeV2::decode on the shipped audiovae.pth — the gate for wiring
# model-level streaming into TtsRuntime::synthesize_stream. Needs the
# openbmb/VoxCPM2 download (see the example header for the run command).
[[example]]
name = "voxcpm2_stream_smoke"
required-features = ["voxcpm"]

# End-to-end HTTP smoke for POST /v1/audio/speech/stream — boots an embedded
# server with the real VoxCPM2 checkpoint and measures first-byte latency
# against the legacy /v1/audio/speech path.
[[example]]
name = "voxcpm2_stream_http_smoke"
required-features = ["voxcpm"]

# Probes loading a real Chronos2 checkpoint through the candle runtime.
[[example]]
name = "chronos2_load_probe"
required-features = ["chronos2"]

# -- Candle-only targets ------------------------------------------------------
# These drive the candle runtimes directly (candle / candle-transformers /
# tokenizers / `vision::candle_yolo` / `RerankImpl::Jina`), so they cannot
# compile in a candle-free build. The router-only consumers -- telencephalon
# and shadow-desktop -- depend on neuron with `default-features = false`, so
# without these gates the whole crate stops being testable without candle.
#
# `chronos2_bench` and the three examples below are auto-discovered targets;
# declaring them explicitly is the only way to attach `required-features`.
[[bench]]
name = "chronos2_bench"
required-features = ["candle"]

# The intent-contract probe drives the local model through the **candle**
# LLM runtime (`LlmImpl::Candle`), and that enum variant only exists behind
# the `candle` feature. Without this gate the *candle-free* build
# (`cargo check --no-default-features --all-targets`) cannot compile this
# test target at all -> E0599 -> the router-only consumers (telencephalon /
# shadow-desktop) lose the whole crate as a testable dependency.
# Same rationale as the candle-only bench/examples below.
[[test]]
name = "llm_intent_contract_probe"
required-features = ["candle"]

[[example]]
name = "vision_api_comprehensive"
required-features = ["candle"]

[[example]]
name = "mxbai_score_check"
required-features = ["candle"]

[[example]]
name = "jina_score_check"
required-features = ["candle"]

[[example]]
name = "ming3_smoke"
required-features = ["ming3"]

[features]
default = ["candle"]
candle = ["dep:candle", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:safetensors", "dep:wide"]
flash-attn = ["candle-transformers/flash-attn", "dep:candle-flash-attn"]
metal = ["candle/metal", "candle-nn/metal", "candle-transformers/metal"]
# The `?` in `mistralrs?/cuda` is load-bearing: it turns the
# mistralrs backend's CUDA support on **only when that backend is already
# enabled** — without it, a `--features cuda` build would drag the whole
# mistralrs stack in through the optional dependency. Without the entry at
# all, `--features mistralrs,cuda` compiles the CUDA kernels for candle but
# leaves `mistralrs-core` without its `cuda` feature ⇒ ⇒ the mistralrs leg
# silently runs on the CPU even though the user asked for the GPU.
cuda = ["candle/cuda", "candle-nn/cuda", "candle-transformers/cuda", "mistralrs?/cuda"]
chronos2 = ["candle"]
voxcpm = ["dep:burn", "dep:burn-store", "dep:tokenizers"]
# Ming-3.0-tts (inclusionAI dense 0.5B): contract/tasks/config layers plus
# the burn model stack (backbone via minicpm4, DiT flow head, CFM sampler).
# The AudioVAE + runtime wiring arrive with the runtime knife.
ming3 = ["dep:tokenizers", "dep:burn", "dep:burn-store"]
# Burn-side CUDA backend for the VoxCPM2 TTS runtime (CubeCL kernels).
# Separate from the `cuda` feature above, which is candle's: pulling
# burn/cuda in compiles the CubeCL stack, which is a heavy build. Combine
# them (`--features cuda,voxcpm-cuda`) to put both the LLM and the TTS on
# the GPU. No build-time CUDA toolkit is required (cudarc uses the driver
# API + NVRTC with dynamic-loading fallback), but at runtime the CUDA
# toolkit's `bin` directory must be on PATH so NVRTC can be loaded.
voxcpm-cuda = ["voxcpm", "burn/cuda"]
litert = ["dep:litert-lm"]
asr-audio = ["dep:symphonia", "dep:rubato"]
mistralrs = ["dep:mistralrs", "candle"]
# Pure-Rust GGUF inference via the llama-cpp-2 binding. Build needs cmake
# + a C++ compiler (see the dep comment above). The `candle` feature is
# NOT pulled in — llama-cpp-2 compiles its own ggml-backed inference stack.
llamacpp = ["dep:llama-cpp-2"]
ndarray = ["dep:ndarray"]
# Own-ONNX ASR (SenseVoice via tract) reuses the tract feature; rustfft
# backs the kaldi-style fbank extraction in src/asr/fbank.rs.
# The PP-OCR pipeline (src/ocr/) lives behind the `ocr` meta feature (image
# decode + base64 for the request image source), which `tract` and `ort`
# both enable: `tract` is the pure-Rust executor, `ort` the fast one
# (verified against ort 2.0.0-rc.13, where the rc.12 vitis.rs load-dynamic
# gating bug is fixed).
tract = ["dep:tract-onnx", "dep:ndarray", "dep:tokenizers", "dep:rustfft", "ocr"]
ort = ["dep:ort", "ocr"]
ocr = []
sherpa = ["dep:sherpa-onnx"]
